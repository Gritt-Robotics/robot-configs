name: Deploy

on:
  push:
    branches: [main]

# Deployments must be created in merge order, so a robot's newest one is its newest commit.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: A deployment for each affected robot
    # Needs only git, python3 and gh: no self-hosted runner picks up this public repo's jobs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find affected robots
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A push that creates main has no previous commit to diff against.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            python3 ci/affected_robots.py --base "$BEFORE" > affected.txt
          else
            python3 ci/affected_robots.py --all > affected.txt
          fi
          cat affected.txt

      - name: Create the deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Validation already gated the merge; required_contexts is empty so this run's own
          # pending check does not block its deployments.
          while read -r robot release; do
            printf '{"ref":"%s","environment":"%s","task":"deploy","auto_merge":false,"required_contexts":[],"payload":{"release":"%s"},"description":"%s on %s"}' \
              "$GITHUB_SHA" "$robot" "$release" "${GITHUB_SHA:0:7}" "$release" \
              | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '"\(.environment): deployment \(.id)"'
          done < affected.txt
