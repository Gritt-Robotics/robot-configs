name: Validate

on:
  pull_request:

jobs:
  validate:
    name: Affected robots valid against their releases
    runs-on: self-hosted
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      # The self-hosted workspace is shared with docker-based jobs, which can leave
      # root-owned files behind that break actions/checkout.
      - name: Reclaim workspace
        run: |
          WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
          if [ -n "$WORKSPACE_DIR" ] && [ "$WORKSPACE_DIR" != "/" ]; then
            sudo rm -rf "$WORKSPACE_DIR" || true
            mkdir -p "$WORKSPACE_DIR"
            sudo chown -R $(whoami):$(whoami) "$WORKSPACE_DIR" || true
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the CI helpers
        run: python3 -m unittest discover -s ci

      - name: Log in to Artifact Registry
        run: |
          CRED="${GRITT_GCS_CRED_DIR:-$HOME/.config/gritt/gcs}/adc.json"
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$CRED" gcloud auth print-access-token \
            | docker login -u oauth2accesstoken --password-stdin us-docker.pkg.dev

      - name: Validate each affected robot in its release image
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ci/validate_affected.sh "$BASE_SHA"
