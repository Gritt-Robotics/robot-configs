/**:
  ros__parameters:
    # These parameters define valid spatial regions that pick/place panel poses and purlins can lie
    # in.
    pick_region_x_m: 0.2
    pick_region_y_m: 0.2
    pick_region_z_m: 0.0
    pick_region_x_tol_m: 1.8
    pick_region_y_tol_m: 1.8
    pick_region_z_tol_m: 1.8

    place_region_x_m: 1.0
    place_region_y_m: -2.0
    place_region_z_m: 0.6
    place_region_x_tol_m: 5.003 # 0.7 + 1.303 as panel width for canadian
    place_region_y_tol_m: 3.7
    place_region_z_tol_m: 1.4

    purlin_region_x_m: 1.0
    purlin_region_y_m: -2.0
    purlin_region_z_m: 0.6
    purlin_region_x_tol_m: 5.003
    purlin_region_y_tol_m: 3.7
    purlin_region_z_tol_m: 1.4

planning_manager_node:
  ros__parameters:
    # Robot and frame names.
    robot_name: bx135x_arm
    base_frame: base_link
    ee_frame: gripper_frame_1
    gripper_components:
      [
        "link_6_1",
        "link_5_1",
        "xlf150",
        "xlf150_2",
        "xlf150_3",
        "xlf150_4",
        "xlf150_5",
        "xlf150_6",
        "cup_assembly",
        "cup_assembly_2",
        "cup_assembly_3",
        "cup_assembly_4",
        "cup_assembly_reversed",
        "cup_assembly_reversed_2",
        "arms_hg",
        "gripper_frame_1",
        "gripper_arm",
        "top_bracket",
      ]

    # Scene objects whose collisions with the gripper are allowed while the panel is being picked
    # up, and disallowed again once the robot has retracted away from the pick.
    gripper_allowed_collision_objects_during_pick: ["panel_stack", "urdf_model_base"]

    # Pick-place params.
    gripper_frame_to_cup_surface_m: -0.19
    gripper_frame_y_offset_m: -0.1
    gripper_frame_z_offset_m: -0.1
    obj_to_gripper_frame_x_rot_rad: 3.1415
    obj_to_ee_frame_rot_rad: 0.0
    pre_pick_x_offset_m: -0.15
    post_pick_retract_z_offset_m: 0.07
    post_pick_retract_x_offset_m: 0.10
    override_retract_x_offset_m: -0.08
    pre_place_min_z_in_base_m: 1.0

    # Intermediate waypoints for the robot arm.
    pre_place_waypoint: [-0.799, -0.321, -0.358, 0.015, -1.523, 0.0]

    ## Waree
    pre_return_home_waypoint: [-0.799, -0.321, -0.358, 0.015, -1.523, 0.0]

    ## Canadian solar
    # pre_return_home_waypoint: [-1.012, 0.142, 0.592, -0.009, -1.69, -0.489]

    # If true, adds a pre-return home waypoint.
    add_pre_return_home_waypoint: True

    # Should trajectory stages be merged for execution?
    merge_planning_stages_enabled: False
