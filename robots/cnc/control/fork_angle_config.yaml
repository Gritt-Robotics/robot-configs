# Shared fork-angle threshold and ordering for non-legacy machines, whose fork angle shrinks
# as the forks rise. Single source of truth consumed by multiple nodes (vehicle_state,
# drs_visualizer) and the monitor; legacy machines load fork_angle_config_legacy.yaml
# instead, selected from the robot manifest. The /** wildcard makes this file apply to
# whichever node loads it, regardless of node name.
/**:
  ros__parameters:
    min_allowable_fork_angle_y_rad: 0.08
    forks_up_below_threshold: true
