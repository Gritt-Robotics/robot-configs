keyence_io_node:
  ros__parameters:

    # Watchdog address.
    watchdog_address: 4384

    # Vacuum/blowoff control.
    gripper_control_master_port: 7

    # Cup pressure sensor readings.
    vacuum_sensors_master_port: 4

    # Compressor pressure sensor.
    compressor_master_port: 6
    compressor_pressure_hub_port: 6
    compressor_temperature_hub_port: 5

    # Fork angle measurements.
    chassis_angle_master_port: 3
    fork_angle_master_port: 2

    # Worker button ports.
    worker_button_master_port: 8
    worker_button_hub_port: 2
    worker_button_status_pin: 2
    worker_button_state_pin: 4

    # Vehicle button.
    vehicle_button_master_port: 8

    # Limit switch.
    limit_switch_master_port: 4
    limit_switch_port: 7

    # Tracker gap button.
    tracker_gap_button_master_port: 8
    tracker_gap_button_hub_port: 2
    tracker_gap_button_pin: 2

    # Alerts control.
    alerts_master_port: 8
    beeper_mode_hub_port: 3
    beeper_enable_hub_port: 4
    beeper_enable_pin: 2

    # UPS.
    ups_master_port: 7
    ups_backup_status_hub_port: 1
    ups_relay_status_hub_port: 2
    ups_psu_1_status_hub_port: 5
    ups_psu_2_status_hub_port: 6
    ups_temperature_hub_port: 7
    ups_battery_voltage_hub_port: 8

    # Flip button (momentary push button for panel flip).
    flip_button_master_port: 8
    flip_button_hub_port: 1
    flip_button_hub_pin: 2

    # Generator fuel level.
    generator_fuel_level_master_port: 8
    generator_fuel_level_hub_port: 8
    # Safety controller register address.
    safety_controller_register_address: 900
