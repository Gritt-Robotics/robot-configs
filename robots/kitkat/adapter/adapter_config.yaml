    pallet_snapshot_recording_status_topic_name: /monitor/pallet_completed/recording_in_progress
    last_panel_flipped_snapshot_recording_status_topic_name: /monitor/last_panel_flipped/recording_in_progress
    start_of_row_snapshot_recording_status_topic_name: /monitor/start_of_row/recording_in_progress
    end_of_row_snapshot_recording_status_topic_name: /monitor/end_of_row/recording_in_progress
    start_of_pallet_snapshot_recording_status_topic_name: /monitor/start_of_pallet/recording_in_progress
    svo2_snapshot_recording_status_topic_name: /monitor/svo2_snapshot/recording_in_progress
    sensor_bundle_snapshot_recording_status_topic_name: /monitor/sensor_bundle_snapshot/recording_in_progress
    manual_intervention_recording_status_topic_name: /monitor/manual_intervention/recording_in_progress
