    topic_name_robot_arm_controller_status: /monitor/robot_arm_controller_status
    topic_type_robot_arm_controller_status: system_state_interface/msg/RobotArmControllerStatus
    topic_qos_robot_arm_controller_status: RELIABLE
    topic_name_gripper_state: /gripper_state
    topic_type_gripper_state: gripper_interface/msg/GripperState
