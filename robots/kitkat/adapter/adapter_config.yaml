    topic_name_hazard_detection: /hazard_detection
    topic_type_hazard_detection: system_state_interface/msg/HazardDetection
    topic_qos_hazard_detection: RELIABLE

    # Redis configuration
    redis_host: localhost
    redis_port: 6379
    redis_stream_name: gritt_adapter_stream
    redis_max_stream_length: 1000

    # Socket.io configuration (set socketio_enabled to false to disable)
    socketio_enabled: true
    socketio_server_url: http://localhost:8080
    socketio_namespace: /
    socketio_entity: "grittAdapter"

    # Socket.io retry configuration
    socketio_max_retries: -1  # -1 for infinite retries
    socketio_initial_retry_delay_s: 1.0
    socketio_max_retry_delay_s: 60.0
    socketio_retry_backoff_multiplier: 2.0

    # Backend endpoint URL.
    backend_auth_url: http://localhost:8080/auth/signin

    # Heartbeat configuration
    heartbeat_interval_s: 1.0

    # Minimum interval between consecutive Redis monitor packet publishes (seconds).
    # Prevents high-frequency topic callbacks from flooding the stream.
    monitor_publish_min_interval_s: 1.0

    # Verbose debug logging (e.g. full assembled packets)
    enable_debug: false

    # Process manager configuration
    process_manager_config_file: launch_commands_kitkat.json
    # Directory for subprocess stdout/stderr log files
    log_output_dir: /data/logs
    # Process monitor configuration
    process_monitor_config_file: process_monitors_kitkat.json
    # Command handler service names
    pause_execution_service_name: /pause_execution
    resume_execution_service_name: /resume_execution
    stow_service_name: /stow_request
    reset_drs_service_name: /reset_drs
    commit_calibration_service_name: /commit_calibration
    vehicle_button_state_service_name: /vehicle_button_state_request
    system_ready_topic_name: /ext_inputs/system_ready
    gripper_action_name: keyence_io/gripper_action

    # Operator button service names
    light_and_sound_service_name: /light_and_sound_request

    # Operator button publish topic names
    tracker_gap_topic_name: /monitor/tracker_gap
    manual_install_topic_name: /monitor/manual_install
    pallet_completed_topic_name: /monitor/pallet_completed
    last_panel_flipped_topic_name: /monitor/last_panel_flipped
    start_of_row_topic_name: /monitor/start_of_row
    end_of_row_topic_name: /monitor/end_of_row
    start_of_pallet_topic_name: /monitor/start_of_pallet
    svo2_snapshot_topic_name: /monitor/svo2_snapshot
    sensor_bundle_snapshot_topic_name: /monitor/sensor_bundle_snapshot
    manual_intervention_topic_name: /monitor/manual_intervention
    log_annotations_topic_name: /monitor/log_annotations

