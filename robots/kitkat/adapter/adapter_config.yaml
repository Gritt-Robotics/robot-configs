    topic_name_planner_debug: /planner_debug
    topic_type_planner_debug: planner_msgs/msg/PlannerDebug
    topic_qos_planner_debug: RELIABLE
    topic_name_execution_debug: /execution_debug
    topic_type_execution_debug: planner_msgs/msg/ExecutionDebug
