    topic_type_front_person_detection_image: sensor_msgs/msg/Image
    topic_qos_front_person_detection_image: RELIABLE
    topic_name_sensor_bundle_heartbeat: /sensor_bundle_heartbeat
    topic_type_sensor_bundle_heartbeat: perception_interfaces/msg/SensorBundleHeartbeat
